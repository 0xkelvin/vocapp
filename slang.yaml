base_locale: en
fallback_strategy: none
input_directory: assets/i18n
input_file_pattern: .i18n.yaml
output_directory: lib/i18n
output_file_name: translations.g.dart
lazy: true
locale_handling: true
flutter_integration: true
namespaces: false
translate_var: t
enum_name: AppLocale
class_name: Translations
translation_class_visibility: private
key_case: null
key_map_case: null  
param_case: null  
sanitization:
  enabled: true
  prefix: k
  case: camel
string_interpolation: dart
flat_map: false
translation_overrides: false
timestamp: true
statistics: true
maps:
pluralization:
  auto: cardinal
  default_parameter: n
  cardinal:
  ordinal:
format:
  enabled: true
  width: 150