name: voca_notes
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.6 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  #? State Management
  flutter_bloc: ^8.1.6

  #? Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0

  #? Locale
  slang: ^4.4.0
  slang_flutter: ^4.4.0

  #? Dev Utils
  auto_route: ^9.2.2
  dartz: ^0.10.1
  equatable: ^2.0.5
  logger: ^2.5.0
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3

  #? Interface Utils
  collection: ^1.18.0
  dart_helper_utils: ^3.3.0
  flash: ^3.1.1
  flutter_svg: ^2.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter

  auto_route_generator: ^9.0.0
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.8.0
  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  slang_build_runner: ^4.4.0

flutter_gen:
  output: lib/gen/
  line_length: 80
  parse_metadata: true
  integrations:
    flutter_svg: true
    rive: true
    lottie: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false
      style: dot-delimiter
      class_name: Assets
    exclude: []
  fonts:
    enabled: true
    outputs:
      class_name: FontFamily

flutter:
  uses-material-design: true
